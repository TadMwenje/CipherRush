services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cipherrush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cipherrush_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cipherrush}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cipherrush_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cipherrush}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cipherrush_pgdata:
