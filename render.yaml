# Render Blueprint: the CipherRush API and its Postgres database.
# Render dashboard > New > Blueprint > pick this repo. Secrets are generated by
# Render (JWT_SECRET) or entered in the dashboard (Apple keys); none live here.
#
# Paid plans since 27 Nov 2026 (upgraded in the dashboard; keep these in step so
# a Blueprint sync never moves them back to free). Free web services sleep after
# 15 idle minutes (the first request then takes ~1 minute) and free Postgres
# databases expire after 30 days.

databases:
  - name: cipherrush-db
    databaseName: cipherrush
    user: cipherrush
    plan: basic-256mb # 0.1 CPU, 256 MB RAM, daily backups
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: [] # reachable only from Render services, not the internet

services:
  - type: web
    name: cipherrush-api
    runtime: python
    plan: starter # 0.5 CPU, 512 MB RAM, always on (no cold starts)
    region: frankfurt
    rootDir: backend
    branch: ios-device-testing
    buildCommand: pip install -r requirements-prod.txt
    # Render's proxy appends the real client IP to X-Forwarded-For; uvicorn uses
    # the last hop, so the per-IP rate limits see players, not the proxy.
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/time
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.6 # same as the venv the test suite runs on (see O-08)
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cipherrush-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      # Native app origins (Capacitor iOS / Android) plus the AximoIX web origins.
      - key: CORS_ORIGINS
        value: https://aximoix.com,https://cipherrush.aximoix.com,capacitor://localhost,https://localhost
      # Every request reaches Render through Cloudflare, which sets the real
      # visitor IP in CF-Connecting-IP (see backend/ratelimit.py).
      - key: TRUST_CF_CONNECTING_IP
        value: "true"
      - key: GOOGLE_CLIENT_IDS
        value: 548808788960-3jtmc07lqac6u2ff2khud4t3hhc8bpj0.apps.googleusercontent.com,548808788960-uh132dq0puvk2lrjtph8n5a4bd33t4jn.apps.googleusercontent.com
      - key: APPLE_CLIENT_IDS
        value: com.aximoix.cipherrush
      # Sign in with Apple server keys: entered in the Render dashboard, never committed.
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      # Verification and password-reset email (backend/mailer.py). ZeptoMail's HTTPS
      # API (chosen while on Render's free plan, which blocks outbound SMTP). The send token is
      # entered in the Render dashboard, never committed.
      - key: ZEPTOMAIL_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: support@aximoix.com
      - key: MAIL_FROM_NAME
        value: CipherRush Security
      # Where the email links point (the reset and confirm pages are served by the API).
      - key: PUBLIC_BASE_URL
        value: https://api.aximoix.com
