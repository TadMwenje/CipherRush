# Render Blueprint: the CipherRush API and its Postgres database.
# Render dashboard > New > Blueprint > pick this repo. Secrets are generated by
# Render (JWT_SECRET) or entered in the dashboard (Apple keys); none live here.
#
# Plans start on "free" so nothing is billed. Before launch, move both to paid:
# free web services sleep after 15 idle minutes (the first request then takes
# ~1 minute), and free Postgres databases expire after 30 days.

databases:
  - name: cipherrush-db
    databaseName: cipherrush
    user: cipherrush
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: [] # reachable only from Render services, not the internet

services:
  - type: web
    name: cipherrush-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    branch: ios-device-testing
    buildCommand: pip install -r requirements-prod.txt
    # Render's proxy appends the real client IP to X-Forwarded-For; uvicorn uses
    # the last hop, so the per-IP rate limits see players, not the proxy.
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/time
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.6 # same as the venv the test suite runs on (see O-08)
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cipherrush-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      # Native app origins (Capacitor iOS / Android). Add the web app's origin if it's ever hosted.
      - key: CORS_ORIGINS
        value: capacitor://localhost,https://localhost
      - key: GOOGLE_CLIENT_IDS
        value: 548808788960-3jtmc07lqac6u2ff2khud4t3hhc8bpj0.apps.googleusercontent.com
      - key: APPLE_CLIENT_IDS
        value: com.aximoix.cipherrush
      # Sign in with Apple server keys: entered in the Render dashboard, never committed.
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
